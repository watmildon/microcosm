name: Update GeoJSON Data

on:
  schedule:
    # Run at 07:23 UTC daily. Off-the-hour avoids GitHub Actions cron-pileup
    # delays, and this window is lighter on overpass-api.de than the popular
    # 04:00 UTC slot where we saw 504s.
    - cron: '23 7 * * *'
  workflow_dispatch: # Allow manual trigger from Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and convert data
        run: python3 fetch.py
        env:
          MICROCOSM_DROP_THRESHOLD: ${{ vars.DROP_THRESHOLD || '50' }}
          MICROCOSM_MAX_DATA_LAG_HOURS: ${{ vars.MAX_DATA_LAG_HOURS || '48' }}
          MICROCOSM_USER_AGENT: ${{ vars.USER_AGENT }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.geojson
          git diff --staged --quiet && echo "No changes to commit." || (git commit -m "Update data.geojson" && git push)
