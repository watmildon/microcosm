name: Update GeoJSON Data

on:
  schedule:
    # Run at 07:23 UTC daily. Off-the-hour avoids the worst GitHub Actions
    # cron pileup, but scheduled runs are still often delayed by several hours,
    # so don't rely on this firing at a particular time of day.
    - cron: '23 7 * * *'
  workflow_dispatch: # Allow manual trigger from Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # Worst case is every endpoint hitting fetch.py's 90s request timeout,
    # well under this.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch and convert data
        run: python3 fetch.py
        env:
          # Keep stdout and stderr interleaved in order in the job log.
          PYTHONUNBUFFERED: '1'
          MICROCOSM_DROP_THRESHOLD: ${{ vars.DROP_THRESHOLD || '50' }}
          MICROCOSM_MAX_DATA_LAG_HOURS: ${{ vars.MAX_DATA_LAG_HOURS || '48' }}
          MICROCOSM_USER_AGENT: ${{ vars.USER_AGENT }}
          # Optional. A self-hosted or key-bearing Overpass instance, tried before
          # the public endpoints. Unset in forks that don't have one, which is fine.
          OVERPASS_PRIMARY_URL: ${{ secrets.OVERPASS_PRIMARY_URL }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.geojson
          git diff --staged --quiet && echo "No changes to commit." || (git commit -m "Update data.geojson" && git push)
